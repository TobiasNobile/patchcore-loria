<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PatchCore live</title>
<link rel="stylesheet" href="/static/live.css">
</head>
<body>

<header id="bankbar">
  <div id="bankname">—</div>
  <div id="chips"></div>
</header>

<main>
  <!-- Gauche : constituer une banque. Hors ligne, coûteux, fait une fois. -->
  <section class="panel">
    <h2>Banque <span class="hint">construire</span></h2>
    <form id="fit" autocomplete="off">
      <label for="task">Tâche<small>nomme la banque, ex. DetectionKnife</small></label>
      <input id="task" name="task" placeholder="DetectionKnife" required>

      <label for="backbone">Backbone<small>plus lourd = mieux séparé, moins fluide</small></label>
      <select id="backbone" name="backbone"></select>

      <label>Couches<small>où extraire les features ; l3 seule sépare souvent le mieux</small></label>
      <div id="layers" class="checks"></div>

      <label for="coreset_pct">Coreset<small>fraction des patchs gardée en banque
        (0,01 = 1 %)</small></label>
      <!-- step doit diviser (valeur - min) : avec min=0,001 un pas de 0,005
           n'accepterait que 0,001 / 0,006 / 0,011… et refuserait 0,01. -->
      <input id="coreset_pct" name="coreset_pct" type="number"
             min="0.001" max="1" step="0.001" value="0.01">

      <label for="train_subset">Images d'entraînement<small>tirage aléatoire dans
        l'archive ; vide = toutes</small></label>
      <input id="train_subset" name="train_subset" type="number" min="1" step="1"
             placeholder="toutes">

      <label>Images du nominal<small>un sous-dossier anomaly/ est repris s'il
        existe, et ne sert qu'à calibrer un seuil</small></label>
      <div class="checks" id="srcmode">
        <label class="check"><input type="radio" name="srcmode" value="zip" checked>
          <span>Archive zip</span></label>
        <label class="check"><input type="radio" name="srcmode" value="dir">
          <span>Dossier d'images</span></label>
      </div>
      <input id="archive" type="file" accept=".zip,application/zip">
      <!-- webkitdirectory : le navigateur ne livre jamais de chemin, seulement
           les fichiers. La page en fait un zip avant l'envoi, ce qui reprend le
           même trajet côté serveur. -->
      <input id="folder" type="file" webkitdirectory multiple hidden>

      <div class="actions">
        <button id="dofit" type="submit">Fitter</button>
      </div>
      <div id="fitbar" hidden><div id="fitfill"></div></div>
      <p id="fitstatus"></p>
      <p id="fiterror"></p>
    </form>
  </section>

  <section id="stage">
    <div id="camframe">
      <img id="cam" hidden alt="">
      <div id="placeholder">caméra à l'arrêt</div>
      <div id="flash"></div>
    </div>
    <div id="score">—</div>
    <div id="verdict" class="idle">arrêté</div>
    <div id="meta"></div>
    <div id="notice" hidden></div>
    <button id="snap" type="button" class="secondary" disabled>📷 Enregistrer la frame</button>
    <div id="capture"></div>
  </section>

  <!-- Droite : scorer en direct. Les champs .live s'ajustent sans interrompre. -->
  <section class="panel" id="livepanel">
    <h2>Direct <span class="hint">scorer</span></h2>
    <form id="params" autocomplete="off">
      <label for="bank_dir">Banque</label>
      <select id="bank_dir" name="bank_dir"></select>

      <label for="source">Source<small>0 = webcam, ou fichier / URL</small></label>
      <input id="source" name="source" value="0">

      <label for="loop" class="check">
        <input id="loop" name="loop" type="checkbox">
        <span>Boucler<small>rejouer un fichier sans fin</small></span>
      </label>

      <div class="actions">
        <button id="start" type="submit">Démarrer</button>
        <button id="stop" type="button" class="secondary" disabled>Arrêter</button>
      </div>
      <p id="error"></p>

      <!-- Masqués, mais gardés dans le DOM : /api/config les renseigne toujours,
           donc INFER_FAISS_GPU / INFER_FAISS_THREADS restent effectifs, et
           readParams() continue de les envoyer. Retirer `hidden` les rend. -->
      <div id="advanced" hidden>
        <label for="device">Calcul<small>auto = cuda si présent, sinon cpu</small></label>
        <select id="device" name="device">
          <option value="auto">auto</option>
          <option value="cpu">cpu</option>
          <option value="cuda">cuda</option>
        </select>

        <label for="faiss_threads">Threads FAISS<small>cœurs pour la recherche</small></label>
        <input id="faiss_threads" name="faiss_threads" type="number" min="1" step="1" value="1">

        <label for="faiss_gpu" class="check">
          <input id="faiss_gpu" name="faiss_gpu" type="checkbox">
          <span>FAISS sur GPU<small>⚠ exige une carte NVIDIA et faiss-gpu</small></span>
        </label>

        <label for="threshold">Seuil<small>au-delà, verdict anomalie</small></label>
        <!-- step=any : un seuil se lit entre deux modes d'un histogramme de
             scores, ce n'est pas un multiple de quoi que ce soit. -->
        <input id="threshold" name="threshold" type="number" step="any" placeholder="aucun">
      </div>
    </form>

    <h2 class="spaced">Affichage <span class="hint">réglable en direct</span></h2>

    <label for="stride">Stride<small>ne score qu'une frame sur N ; l'aperçu reste fluide</small></label>
    <div class="slider">
      <input id="stride" class="live" type="number" min="1" step="1" value="20">
    </div>

    <label for="zoom">Zoom<small>recadrage centré</small></label>
    <div class="slider">
      <input id="zoom" class="live" type="number" min="1" step="0.1" value="1">
    </div>

    <label for="vmax">Valeur max de normalisation de la heatmap<small>conseillé
      <span id="vmaxhint">—</span></small></label>
    <div class="slider">
      <input id="vmax" class="live" type="number" min="1" step="1" value="10">
    </div>

    <label for="alpha">Alpha<small>0 = heatmap pleine · 1 = seul l'anormal reste</small></label>
    <div class="slider">
      <input id="alpha" class="live" type="range" min="0" max="1" step="0.02" value="0.71">
      <output id="alphaval" for="alpha">—</output>
    </div>
  </section>
</main>

<script src="/static/live.js"></script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchcore"
version = "0.1.0"
requires-python = ">=3.7"
dependencies = [
    "click>=8.0.3",
    "faiss-cpu",
    "matplotlib>=3.5.0",
    "pillow>=8.4.0",
    "pretrainedmodels>=0.7.4",
    "torch>=1.10.0",
    "scikit-image>=0.18.3",
    "scikit-learn>=1.0.1",
    "scipy>=1.7.1",
    "torchvision>=0.11.1",
    "tqdm>=4.62.3",
]

[project.optional-dependencies]
dev = [
    "black>=21.11b0",
    "flake8>=4.0.1",
    "isort>=5.10.1",
    "pytest>=6.2.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patchcore"]

[tool.black]
line-length = 88
target-version = ["py37", "py38", "py39"]

[tool.isort]
profile = "black"
line_length = 88
force_single_line = true
use_parentheses = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "I201", "I100"]
